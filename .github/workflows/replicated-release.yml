name: Replicated Release

on:
  push:
    tags:
      - 'edge-*'
      - 'stable-*'

permissions:
  contents: read

jobs:
  replicated-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Build Helm dependencies
        run: |
          cd charts/linkerd-control-plane
          helm dependency update

      - name: Package Helm chart
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          helm package charts/linkerd-control-plane --version "${VERSION}" --app-version "${VERSION}"
          echo "chart_file=linkerd-control-plane-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Replicated CLI
        run: |
          curl -s https://api.github.com/repos/replicatedhq/replicated/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d '"' -f 4 \
            | xargs curl -sL \
            | tar xz -C /usr/local/bin replicated

      - name: Create Replicated release
        id: release
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          REPLICATED_APP: ${{ secrets.REPLICATED_APP }}
        run: |
          RELEASE_SEQ=$(replicated release create \
            --chart "${{ steps.package.outputs.chart_file }}" \
            --version "${{ steps.package.outputs.version }}" \
            --release-notes "Automated release for ${{ steps.package.outputs.version }}" \
            --promote Unstable \
            --auto -q)
          echo "release_sequence=${RELEASE_SEQ}" >> "$GITHUB_OUTPUT"

      - name: Promote to Stable (stable tags only)
        if: startsWith(github.ref_name, 'stable-')
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          REPLICATED_APP: ${{ secrets.REPLICATED_APP }}
        run: |
          replicated release promote \
            "${{ steps.release.outputs.release_sequence }}" Stable \
            --version "${{ steps.package.outputs.version }}" \
            --release-notes "Stable release ${{ steps.package.outputs.version }}"
